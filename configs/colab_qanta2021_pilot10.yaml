# Free Colab pilot. Pin model.revision once before any model calls.
experiment_id: qanta2021_colab_pilot10_consistency_v2
seed: 42
dataset:
  name: QANTA_2021_12_20_PILOT_DIAGNOSTIC
  path: data/processed/qanta2021/pilot10.jsonl
  split_manifest: data/processed/qanta2021/pilot10_splits.json
  limit_questions: null
fractions: [0.5, 1.0]
model:
  backend: huggingface
  name: Qwen/Qwen2.5-0.5B-Instruct
  revision: SET_COMMIT_SHA
  device: cuda
  samples: 2
  temperature: 0.2
  sample_temperature: 0.7
  max_input_tokens: 2048
  max_output_tokens: 128
retrieval:
  corpus: data/raw/evidence_corpus_qanta2021.jsonl
  top_k: 3
  max_doc_words: 150
controller:
  actions: [RETRIEVE]
  max_steps: 1
evaluation:
  include_wait: false
reward:
  correct: 1.0
  incorrect: -2.0
  abstain: 0.0
cost:
  dollars_weight: 0.0
  input_usd_per_million: null
  output_usd_per_million: null
budget:
  max_new_calls: 100
cache_dir: data/cache_qanta2021

# Repeated answers are consistency signals, not correctness probabilities.
calibration:
  enabled: false
