[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-confidence-agent"
version = "0.1.0"
description = "Research pipeline for computationally cost-aware question answering with consistency signals"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
data = ["mwparserfromhell>=0.6.6,<1"]
gpu = ["torch>=2.4,<3", "transformers>=4.45,<5", "accelerate>=1,<2"]

[project.scripts]
adaptive-qa = "adaptive_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
